<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Human Detection Tool | OmegaSTEAM</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}

/* LAYOUT */
.layout{display:grid;grid-template-columns:3fr 1fr;gap:20px;max-width:1300px;margin:20px auto}
.main{padding:10px}
.ads{background:#0f172a}
.adbox{height:600px;background:#1e293b;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#64748b}

/* MOBILE */
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .ads{order:2}
}

/* UI */
h1{color:#38bdf8;text-align:center}
video,canvas{width:100%;border-radius:12px}
.video-wrap{position:relative}
canvas{position:absolute;top:0;left:0}

.panel{margin-top:10px;text-align:center}
input{padding:8px;border-radius:6px;border:none;width:150px}
button{padding:8px 12px;margin:5px;border:none;border-radius:6px;background:#38bdf8;color:black;font-weight:bold}
button:hover{background:#0ea5e9}

.led{display:inline-block;width:14px;height:14px;border-radius:50%;background:red;margin-left:10px}
.project-links{margin-top:25px}
.proj{display:block;background:#1e293b;padding:10px;border-radius:8px;margin:8px 0;text-decoration:none;color:white}
.proj:hover{background:#0ea5e9;color:black}
</style>
</head>

<body>

<div class="layout">

<div class="main">

<h1>AI Human Detection Tool</h1>

<div class="video-wrap">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
</div>

<div class="panel">
<input type="text" id="ip" placeholder="ESP IP">
<button id="connectBtn">Connect</button>
<button id="switchCam">Switch Cam</button>
<span class="led" id="led"></span>
</div>

<div class="project-links">
<h3>Build This Project</h3>
<a class="proj" href="/projects/esp01-relay/">ESP-01 Relay</a>
<a class="proj" href="/projects/esp32-human-detect/">ESP32 Version</a>
<a class="proj" href="/projects/esp8266-human-detect/">ESP8266 Version</a>
</div>

</div>

<div class="ads">
<div class="adbox">AdSense Area</div>
</div>

</div>

<script>
let model,video=document.getElementById("video"),canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d")
let ip="",led=document.getElementById("led")
let lastSeen=0,state="off",stream,currentFacing="environment"
let beep=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg")

document.getElementById("connectBtn").onclick=()=>ip=document.getElementById("ip").value
document.getElementById("switchCam").onclick=async()=>{currentFacing=currentFacing==="environment"?"user":"environment";await startCam()}

async function startCam(){
 if(stream) stream.getTracks().forEach(t=>t.stop())
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:currentFacing}}})
 video.srcObject=stream
 return new Promise(r=>video.onloadedmetadata=()=>{canvas.width=video.videoWidth;canvas.height=video.videoHeight;r()})
}

async function detect(){
 const preds=await model.detect(video)
 ctx.clearRect(0,0,canvas.width,canvas.height)
 let human=false

 preds.forEach(p=>{
   if(p.class==="person"){
     human=true
     ctx.strokeStyle="lime"
     ctx.lineWidth=2
     ctx.strokeRect(...p.bbox)
   }
 })

 if(human){
   lastSeen=Date.now()
   if(state!=="on"){send("on");led.style.background="lime";beep.play();state="on"}
 }else if(Date.now()-lastSeen>3000 && state!=="off"){
   send("off");led.style.background="red";beep.play();state="off"
 }

 requestAnimationFrame(detect)
}

function send(cmd){ if(ip) fetch("http://"+ip+"/"+cmd).catch(()=>{}) }

async function init(){
 await startCam()
 model=await cocoSsd.load()
 detect()
}

init()
document.addEventListener("contextmenu",e=>e.preventDefault())
</script>

</body>
</html>
