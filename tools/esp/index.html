<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Human Detection Control | OmegaSTEAM</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
}

/* LAYOUT */
.tool-layout{
  display:grid;
  grid-template-columns:3fr 1fr;
  max-width:1300px;
  margin-left:30px;
  margin-right:auto;
  gap:25px;
  padding:20px;
}

.tool-main{text-align:center}

h1{color:#38bdf8}

/* CONTROL PANEL */
.control-panel{
  margin:15px auto;
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  display:inline-block;
}

input{
  padding:8px;
  border-radius:6px;
  border:none;
  width:180px;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  background:#22c55e;
  color:white;
  cursor:pointer;
  margin-left:8px;
}

/* LED */
.led{
  width:16px;
  height:16px;
  border-radius:50%;
  display:inline-block;
  margin-left:10px;
  background:red;
  box-shadow:0 0 10px red;
}

/* VIDEO WRAPPER */
.video-box{
  position:relative;
  display:inline-block;
  margin-top:15px;
}

video,canvas{
  border-radius:12px;
}

canvas{
  position:absolute;
  left:0;
  top:0;
}

/* ADS */
.tool-ads{position:sticky;top:20px}
.ad-box{
  height:600px;
  background:#0f172a;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
  border-radius:12px;
}

@media(max-width:900px){
  .tool-layout{grid-template-columns:1fr;margin-left:auto}
  .tool-ads{display:none}
}
</style>
</head>

<body>

<main class="tool-layout">

<div class="tool-main">
<h1>AI Human Detection Controller</h1>

<div class="control-panel">
  ESP IP:
  <input type="text" id="ipInput" placeholder="192.168.1.100">
  <button onclick="startSystem()">Start</button>
  <span class="led" id="led"></span>
</div>

<div class="video-box">
  <video id="v" width="640" height="480" autoplay muted playsinline></video>
  <canvas id="c" width="640" height="480"></canvas>
</div>
</div>

<aside class="tool-ads">
  <div class="ad-box">Advertisement</div>
</aside>

</main>

<script>
let lastState=null,lastSend=0;
const v=document.getElementById("v"),
c=document.getElementById("c"),
ctx=c.getContext("2d"),
led=document.getElementById("led");

const beep=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

async function cam(){
  const s=await navigator.mediaDevices.getUserMedia({video:true});
  v.srcObject=s;
  return new Promise(r=>v.onloadedmetadata=()=>{v.play();r();});
}

function send(ip,state){
  fetch("http://"+ip+"/"+state).catch(()=>{});
}

function setLed(on){
  led.style.background=on?"#22c55e":"red";
  led.style.boxShadow=on?"0 0 15px #22c55e":"0 0 10px red";
  beep.currentTime=0;
  beep.play();
}

async function startSystem(){
  const ip=document.getElementById("ipInput").value;
  if(!ip)return alert("Enter ESP IP");

  await cam();
  const model=await cocoSsd.load();

  async function loop(){
    const p=await model.detect(v);
    ctx.clearRect(0,0,c.width,c.height);

    let humans=0;
    p.forEach(o=>{
      if(o.class==="person"){
        humans++;
        ctx.strokeStyle="lime";
        ctx.lineWidth=2;
        ctx.strokeRect(...o.bbox);
      }
    });

    const state=humans>0?"on":"off";
    const now=Date.now();

    if(state!==lastState && now-lastSend>2000){
      send(ip,state);
      setLed(state==="on");
      lastState=state;
      lastSend=now;
    }

    requestAnimationFrame(loop);
  }
  loop();
}

/* Disable right click */
document.addEventListener("contextmenu",e=>e.preventDefault());

/* Block basic inspect shortcuts */
document.addEventListener("keydown",e=>{
  if(e.key==="F12" || (e.ctrlKey&&e.shiftKey&&e.key==="I") || (e.ctrlKey&&e.key==="u")){
    e.preventDefault();
  }
});
</script>

</body>
</html>
