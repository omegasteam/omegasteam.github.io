<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Human Detection Tool | OmegaSTEAM</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
}

/* LAYOUT */
.tool-layout{
  display:grid;
  grid-template-columns:3fr 1fr;
  gap:25px;
  max-width:1300px;
  margin-left:30px;
  margin-right:auto;
  padding:20px;
}

.tool-main{ text-align:center; }

.back-btn{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

h1{ color:#38bdf8; }

/* VIDEO */
.video-box{
  position:relative;
  display:inline-block;
}

video, canvas{
  width:640px;
  height:480px;
  border-radius:12px;
}

canvas{
  position:absolute;
  left:0;
  top:0;
}

/* ESP CONTROL */
.control-box{
  margin-top:15px;
  background:#1e293b;
  padding:15px;
  border-radius:12px;
}

input{
  padding:8px;
  width:200px;
  border-radius:6px;
  border:none;
}

.led{
  display:inline-block;
  width:15px;
  height:15px;
  border-radius:50%;
  margin-left:10px;
  background:red;
}

.led.on{ background:#22c55e; }

/* PROJECT LINKS */
.project-links{
  margin-top:25px;
  background:#1e293b;
  padding:15px;
  border-radius:12px;
}

.proj-btn{
  display:block;
  margin:10px 0;
  padding:10px;
  background:#22c55e;
  color:white;
  text-decoration:none;
  border-radius:8px;
  transition:0.2s;
}

.proj-btn:hover{
  background:#16a34a;
  transform:scale(1.03);
}

/* ADS */
.tool-ads{
  position:sticky;
  top:20px;
}

.ad-box{
  background:#111827;
  height:600px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

/* MOBILE */
@media(max-width:900px){
  .tool-layout{ grid-template-columns:1fr; margin-left:auto; }
  .tool-ads{ display:none; }
}
</style>
</head>

<body>

<main class="tool-layout">

  <div class="tool-main">

    <a href="/tools/" class="back-btn">← Back to Tools</a>
    <h1>AI Human Detection</h1>

    <div class="video-box">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="control-box">
      ESP IP:
      <input id="espip" placeholder="192.168.1.50">
      <span>LED:</span>
      <span id="led" class="led"></span>
    </div>

    <div class="project-links">
      <h3>Build This With Hardware</h3>
      <a href="/projects/esp01-relay/" class="proj-btn">ESP-01 Relay Version</a>
      <a href="/projects/esp32-human-detect/" class="proj-btn">ESP32 Version</a>
      <a href="/projects/esp8266-human-detect/" class="proj-btn">ESP8266 Version</a>
    </div>

  </div>

  <aside class="tool-ads">
    <div class="ad-box">Advertisement</div>
  </aside>

</main>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const led = document.getElementById('led');
const ipInput = document.getElementById('espip');

let lastState = "off";
let lastSend = 0;
const delay = 2000;

// Beep sound
function beep(){
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  osc.type="sine";
  osc.frequency.value=700;
  osc.connect(audioCtx.destination);
  osc.start();
  setTimeout(()=>osc.stop(),150);
}

async function setupCamera(){
  const stream = await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject = stream;
  return new Promise(res=> video.onloadedmetadata=res);
}

async function start(){
  await setupCamera();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const model = await cocoSsd.load();

  async function detect(){
    const preds = await model.detect(video);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    let humans = 0;

    preds.forEach(p=>{
      if(p.class==='person'){
        humans++;
        ctx.strokeStyle='lime';
        ctx.lineWidth=3;
        ctx.strokeRect(...p.bbox);
      }
    });

    const state = humans>0 ? "on":"off";
    const now = Date.now();

    if(state!==lastState && now-lastSend>delay){
      const ip = ipInput.value.trim();
      if(ip){
        fetch(`http://${ip}/${state}`).catch(()=>{});
      }
      led.className = state==="on" ? "led on":"led";
      beep();
      lastState=state;
      lastSend=now;
    }

    requestAnimationFrame(detect);
  }

  detect();
}

start();

// disable right click (basic protection)
document.addEventListener("contextmenu", e=>e.preventDefault());
</script>

</body>
</html>
