<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Human Detection Control | OmegaSTEAM</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.9.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:white;
}

.tool-layout{
  display:grid;
  grid-template-columns:3fr 1fr;
  gap:25px;
  max-width:1300px;
  margin-left:30px;
  padding:20px;
}

.tool-main{text-align:center;}

.back-btn{
  color:#38bdf8;
  text-decoration:none;
  font-weight:bold;
}

h1{color:#38bdf8;}

.video-box{
  position:relative;
  width:100%;
  max-width:640px;
  margin:auto;
}

video,canvas{
  width:100%;
  border-radius:12px;
}

canvas{
  position:absolute;
  top:0;
  left:0;
}

.control-panel{
  margin-top:15px;
}

input{
  padding:10px;
  border-radius:6px;
  border:none;
  width:200px;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#38bdf8;
  color:#0f172a;
  font-weight:bold;
  cursor:pointer;
}

.led{
  width:15px;
  height:15px;
  background:#333;
  border-radius:50%;
  display:inline-block;
  margin-left:10px;
}

.led.on{background:#22c55e;box-shadow:0 0 10px #22c55e;}

.tool-ads{
  position:sticky;
  top:20px;
}

.ad-box{
  height:600px;
  background:#1e293b;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

@media(max-width:900px){
  .tool-layout{grid-template-columns:1fr;margin:auto;}
  .tool-ads{display:none;}
}
</style>
</head>

<body>

<main class="tool-layout">

<div class="tool-main">
<a href="/tools/" class="back-btn">← Back to Tools</a>
<h1>AI Human Detection ESP Control</h1>

<div class="video-box">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div class="control-panel">
  <input type="text" id="espip" placeholder="Enter ESP IP">
  <button id="connectBtn">Connect</button>
  <span class="led" id="led"></span>
</div>
</div>

<aside class="tool-ads">
  <div class="ad-box">Advertisement</div>
</aside>

</main>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const ipInput=document.getElementById("espip");
const led=document.getElementById("led");
const connectBtn=document.getElementById("connectBtn");

let model;
let espIP=null;
let lastHumanTime=0;
let ledState="off";

function beep(){
  const a=new(window.AudioContext||webkitAudioContext)();
  const o=a.createOscillator();
  o.frequency.value=750;
  o.connect(a.destination);
  o.start();
  setTimeout(()=>o.stop(),120);
}

async function startCamera(){
  const stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"},audio:false
  });
  video.srcObject=stream;
  return new Promise(resolve=>{
    video.onloadedmetadata=()=>{
      video.play();
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
      resolve();
    };
  });
}

async function detect(){
  if(!model) model=await cocoSsd.load();
  const preds=await model.detect(video);

  ctx.clearRect(0,0,canvas.width,canvas.height);
  let humans=0;

  preds.forEach(p=>{
    if(p.class==="person"){
      humans++;
      const scaleX=canvas.width/video.videoWidth;
      const scaleY=canvas.height/video.videoHeight;
      ctx.strokeStyle="lime";
      ctx.lineWidth=3;
      ctx.strokeRect(p.bbox[0]*scaleX,p.bbox[1]*scaleY,p.bbox[2]*scaleX,p.bbox[3]*scaleY);
    }
  });

  const now=Date.now();

  if(humans>0){
    lastHumanTime=now;
    if(ledState==="off"){
      ledState="on";
      led.classList.add("on");
      if(espIP) fetch(`http://${espIP}/on`).catch(()=>{});
      beep();
    }
  }else{
    if(ledState==="on" && now-lastHumanTime>3000){
      ledState="off";
      led.classList.remove("on");
      if(espIP) fetch(`http://${espIP}/off`).catch(()=>{});
      beep();
    }
  }

  requestAnimationFrame(detect);
}

connectBtn.onclick=()=>{
  espIP=ipInput.value.trim();
  if(!espIP) return alert("Enter ESP IP");
  connectBtn.innerText="CONNECTED";
  connectBtn.style.background="#16a34a";
};

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&e.key==="I")) e.preventDefault();
});

startCamera().then(detect);
</script>

</body>
</html>
