<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Spectator FPV | OmegaSTEAM</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

/* LAYOUT */

.tool-layout{
display:grid;
grid-template-columns:3fr 1fr;
gap:25px;
max-width:1400px;
margin-left:30px;
padding:20px;
}

.tool-main{
text-align:left;
}

/* TITLE */

h1{
color:#38bdf8;
margin-bottom:10px;
}

.back-btn{
color:#38bdf8;
text-decoration:none;
font-weight:bold;
display:inline-block;
margin-bottom:10px;
}

/* CONTROLS */

.control-panel{
margin-bottom:15px;
}

input{
padding:10px;
border-radius:6px;
border:none;
width:200px;
margin-right:10px;
}

button{
padding:10px 16px;
border:none;
border-radius:6px;
background:#38bdf8;
color:#0f172a;
font-weight:bold;
cursor:pointer;
}

/* FPV VIEW */

.video-box{
width:100%;
height:75vh;
background:black;
border-radius:12px;
overflow:hidden;
border:2px solid #1e293b;
box-shadow:0 0 30px rgba(56,189,248,0.2);
position:relative;
}

/* FORCE FULL COVER */

.video-box iframe{
position:absolute;
top:50%;
left:50%;
width:120%;
height:120%;
transform:translate(-50%,-50%);
border:none;
}

/* ADS */

.tool-ads{
position:sticky;
top:20px;
}

.ad-box{
height:600px;
background:#1e293b;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
color:#64748b;
}

/* MOBILE */

@media(max-width:900px){

.tool-layout{
grid-template-columns:1fr;
margin:auto;
}

.tool-ads{
position:static;
margin-top:25px;
}

.ad-box{
height:120px;
}

.video-box{
height:55vh;
}

}

</style>
</head>

<body>

<main class="tool-layout">

<div class="tool-main">

<a href="/tools/" class="back-btn">← Back to Tools</a>

<h1>VR Spectator FPV Viewer</h1>

<div class="control-panel">
<input type="text" id="ipInput" placeholder="Enter Camera IP">
<button id="connectBtn">Connect</button>
</div>

<div class="video-box">
<iframe id="fpvFrame"></iframe>
</div>

</div>

<aside class="tool-ads">
<div class="ad-box">Advertisement</div>
</aside>

</main>

<script>

const ipInput=document.getElementById("ipInput");
const connectBtn=document.getElementById("connectBtn");
const frame=document.getElementById("fpvFrame");

connectBtn.onclick=function(){

let ip=ipInput.value.trim();

if(!ip){
alert("Enter camera IP");
return;
}

frame.src=`http://${ip}:8080`;

connectBtn.innerText="CONNECTED";
connectBtn.style.background="#16a34a";

};

</script>

</body>
</html><!DOCTYPE html>
